<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Nickname Generator - Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .poke-red { background-color: #EF5350; }
        .poke-blue { background-color: #2A75BB; }
        .poke-yellow { background-color: #FFCB05; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="poke-red text-white p-4 shadow-md">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <button class="text-2xl">←</button>
            <h1 class="text-xl font-bold">Nickname Generator</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Step 1: Select Pokémon -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <h2 class="font-semibold text-gray-800 mb-3">1. Select Your Pokémon</h2>
            <div class="relative">
                <input type="text" placeholder="Search Pokémon..."
                    class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none">
            </div>
            <!-- Selected Pokémon Preview -->
            <div class="mt-3 flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png"
                    alt="Charizard" class="w-16 h-16">
                <div>
                    <p class="font-semibold">Charizard</p>
                    <div class="flex gap-1 mt-1">
                        <span class="text-xs px-2 py-0.5 rounded-full bg-orange-500 text-white">Fire</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-400 text-white">Flying</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Step 2: Name Style -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <h2 class="font-semibold text-gray-800 mb-3">2. What style of nickname?</h2>
            <div class="grid grid-cols-2 gap-2">
                <button class="p-3 border-2 border-blue-500 bg-blue-50 rounded-lg text-left">
                    <span class="font-medium text-blue-700">Cool</span>
                    <p class="text-xs text-gray-500 mt-1">Badass, intimidating</p>
                </button>
                <button class="p-3 border-2 border-gray-200 rounded-lg text-left hover:border-gray-300">
                    <span class="font-medium">Cute</span>
                    <p class="text-xs text-gray-500 mt-1">Adorable, sweet</p>
                </button>
                <button class="p-3 border-2 border-gray-200 rounded-lg text-left hover:border-gray-300">
                    <span class="font-medium">Funny</span>
                    <p class="text-xs text-gray-500 mt-1">Puns, jokes</p>
                </button>
                <button class="p-3 border-2 border-gray-200 rounded-lg text-left hover:border-gray-300">
                    <span class="font-medium">Mythical</span>
                    <p class="text-xs text-gray-500 mt-1">Legendary, epic</p>
                </button>
            </div>
        </section>

        <!-- Step 3: Type Reference -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <h2 class="font-semibold text-gray-800 mb-3">3. Reference Pokémon's type?</h2>
            <div class="space-y-2">
                <button class="w-full p-3 border-2 border-blue-500 bg-blue-50 rounded-lg text-left flex items-center justify-between">
                    <div>
                        <span class="font-medium text-blue-700">Yes, use types</span>
                        <p class="text-xs text-gray-500 mt-1">Fire/Flying themed names</p>
                    </div>
                    <span class="text-blue-500">✓</span>
                </button>
                <button class="w-full p-3 border-2 border-gray-200 rounded-lg text-left hover:border-gray-300">
                    <span class="font-medium">No, keep it general</span>
                    <p class="text-xs text-gray-500 mt-1">Type-neutral names</p>
                </button>
            </div>
        </section>

        <!-- Step 4: Name Length -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <h2 class="font-semibold text-gray-800 mb-3">4. Preferred length?</h2>
            <div class="flex gap-2">
                <button class="flex-1 p-3 border-2 border-gray-200 rounded-lg hover:border-gray-300">
                    <span class="font-medium">Short</span>
                    <p class="text-xs text-gray-500">3-5 chars</p>
                </button>
                <button class="flex-1 p-3 border-2 border-blue-500 bg-blue-50 rounded-lg">
                    <span class="font-medium text-blue-700">Medium</span>
                    <p class="text-xs text-gray-500">6-8 chars</p>
                </button>
                <button class="flex-1 p-3 border-2 border-gray-200 rounded-lg hover:border-gray-300">
                    <span class="font-medium">Long</span>
                    <p class="text-xs text-gray-500">9-12 chars</p>
                </button>
            </div>
        </section>

        <!-- Generate Button -->
        <button class="w-full poke-blue text-white font-semibold py-4 rounded-xl shadow-md hover:opacity-90 transition">
            Generate Nicknames
        </button>

        <!-- Results Section -->
        <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-200">
            <h2 class="font-semibold text-gray-800 mb-3">Generated Nicknames</h2>
            <div class="space-y-2">
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <span class="font-medium">Inferno</span>
                    <div class="flex gap-2">
                        <button class="text-gray-400 hover:text-blue-500">📋</button>
                        <button class="text-gray-400 hover:text-yellow-500">⭐</button>
                    </div>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <span class="font-medium">Blaze</span>
                    <div class="flex gap-2">
                        <button class="text-gray-400 hover:text-blue-500">📋</button>
                        <button class="text-gray-400 hover:text-yellow-500">⭐</button>
                    </div>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <span class="font-medium">Skyfire</span>
                    <div class="flex gap-2">
                        <button class="text-gray-400 hover:text-blue-500">📋</button>
                        <button class="text-gray-400 hover:text-yellow-500">⭐</button>
                    </div>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <span class="font-medium">Phoenix</span>
                    <div class="flex gap-2">
                        <button class="text-gray-400 hover:text-blue-500">📋</button>
                        <button class="text-gray-400 hover:text-yellow-500">⭐</button>
                    </div>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <span class="font-medium">Emberwing</span>
                    <div class="flex gap-2">
                        <button class="text-gray-400 hover:text-blue-500">📋</button>
                        <button class="text-gray-400 hover:text-yellow-500">⭐</button>
                    </div>
                </div>
            </div>
            <button class="w-full mt-3 text-blue-600 font-medium py-2 hover:text-blue-700">
                🔄 Regenerate
            </button>
        </section>
    </main>
</body>
</html>
